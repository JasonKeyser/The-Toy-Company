# fly.toml app configuration file generated for toy-company on 2026-10-31T14:43:29-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'toy-company'
primary_region = 'iad'
console_command = '/code/manage.py shell'

[build]
[env]
  DJANGO_ALLOWED_HOSTS = 'toy-company.fly.dev'
  DJANGO_DATA_DIR = '/data'
  DJANGO_DEBUG = 'False'
  PORT = '8000'

[[mounts]]
  source = 'toy_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

[[statics]]
  guest_path = '/code/static'
  url_prefix = '/static/'
