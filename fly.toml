app = "toy-company"
primary_region = "iad"

[build]

[env]
  DJANGO_DEBUG = "False"
  DJANGO_DATA_DIR = "/data"
  DJANGO_ALLOWED_HOSTS = "toy-company.fly.dev,biznesssavvygames.com,www.biznesssavvygames.com"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "toy_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
