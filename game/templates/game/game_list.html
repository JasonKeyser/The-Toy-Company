<style>
    /* Lines everything up horizontally and aligns items to the bottom so the button matches the dropdowns */
    .horizontal-filter-form {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: flex-end;
        margin-bottom: 24px;
    }

    /* Stacks the label neatly on top of its specific dropdown */
    .filter-field-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }
</style>



<div>
    <form method="get" class="horizontal-filter-form">
        {% for field in filter.form %}
            <div class="filter-field-group">
                <label>{{ field.label }}</label>
                {{ field }}
            </div>
        {% endfor %}
        <button type="submit">Apply Filters</button>
    </form>

</div>

<div>
  {% for player in filter.qs %}
    <div class = "card">
        <span>
            {{ player.company_name }}
            {{ player.turn_number }}
            {{ player.mode }}
            {{ player.status }}
            {{ player.lost_reason }}
            {{ player.difficulty }}
            <a href="{% url 'financial-history' player.pk %}" class="btn btn-primary mt-3">
                See more detail
            </a>
        </span>
    </div>

  {% endfor %}

</div>
